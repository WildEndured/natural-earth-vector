<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Отделение</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="minimap"></canvas>
  <div id="hud">
    <div id="hud-top">
      <div class="team-block team-ru">
        <div class="team-title">🇷🇺 РФ</div>
        <div class="team-count" id="ru-count">0/0</div>
      </div>
      <div class="objective-block">
        <div class="objective-title" id="objective-title">Точка: нейтральна</div>
        <div class="objective-bar"><div class="objective-fill" id="objective-fill"></div></div>
        <div class="time-display" id="time-display">00:00 · ⏸</div>
      </div>
      <div class="team-block team-us">
        <div class="team-title">🇺🇸 США</div>
        <div class="team-count" id="us-count">0/0</div>
      </div>
    </div>
    <div id="hud-bottom">
      <div class="time-row">
        <button class="time-btn" data-speed="0">⏸</button>
        <button class="time-btn active" data-speed="1">1×</button>
        <button class="time-btn" data-speed="2">2×</button>
        <button class="time-btn" data-speed="4">4×</button>
        <button class="time-btn" data-speed="8">8×</button>
      </div>
      <div class="orders-row">
        <button id="btn-move" class="order-btn active">Движ.</button>
        <button id="btn-attack" class="order-btn">Атака</button>
        <button id="btn-hold" class="order-btn">Держ.</button>
        <button id="btn-select-all" class="order-btn">Все</button>
      </div>
      <div class="stances-row">
        <button id="btn-stand" class="stance-btn active">🧍 Стоя</button>
        <button id="btn-crouch" class="stance-btn">🧎 С колена</button>
        <button id="btn-prone" class="stance-btn">🛌 Лёжа</button>
        <button id="btn-reload" class="stance-btn">🔄</button>
      </div>
    </div>
  </div>
  <div id="game-over" class="hidden">
    <h1 id="result-text"></h1>
    <button id="btn-restart">Играть снова</button>
  </div>
  <div id="map-select">
    <h2>Выбор карты</h2>
    <div class="map-buttons">
      <button class="map-btn" data-map="test">
        <div class="map-btn-title">🧪 Тестовая</div>
        <div class="map-btn-desc">200×200 м · быстрый бой</div>
      </button>
      <button class="map-btn" data-map="standard">
        <div class="map-btn-title">🗺 Стандартная</div>
        <div class="map-btn-desc">1000×1000 м · полноценный бой</div>
      </button>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
