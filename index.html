<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="format-detection" content="telephone=no">
    <title>Отделение: РФ vs США</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game" tabindex="0"></canvas>
        <div id="ui">
            <div id="top-panel">
                <div class="team-info" id="ru-info"><h3>🇷🇺 МСО РФ</h3><div id="ru-count">Живых: 10/10</div></div>
                <div id="mission-info"><div>Точка <span id="objective-status">(нейтральна)</span></div><div id="mission-timer">00:00</div></div>
                <div class="team-info" id="us-info"><h3>🇺🇸 США</h3><div id="us-count">Живых: 9/9</div><div id="us-groups" style="font-size: 10px; color: #ffd700; margin-top: 2px;">А: огонь · Б: маневр</div></div>
            </div>
            <div id="reports-log"></div>
            <div id="weapon-info">
                <div id="wi-name">АК-74М</div>
                <div id="wi-stats">
                    <div><span>Калибр:</span> <b id="wi-caliber">5.45×39</b></div>
                    <div><span>Масса:</span> <b id="wi-weight">3.6 кг</b></div>
                    <div><span>БК:</span> <b id="wi-ammo">180 / 30</b></div>
                    <div><span>Дальность:</span> <b id="wi-range">300 / 1000 м</b></div>
                    <div><span>Темп:</span> <b id="wi-rpm">650 в/м</b></div>
                </div>
            </div>
            <div id="camera-controls">
                <button id="cam-up" title="Вверх" aria-label="Вверх">▲</button>
                <button id="cam-zoom-in" title="Приблизить" aria-label="Приблизить">+</button>
                <button id="cam-zoom-out" title="Отдалить" aria-label="Отдалить">−</button>
                <button id="cam-down" title="Вниз" aria-label="Вниз">▼</button>
            </div>
            <div id="radial-menu">
                <button class="radial-btn" data-pos="top" data-order="attack">Атака</button>
                <button class="radial-btn" data-pos="right" data-order="move">Движение</button>
                <button class="radial-btn" data-pos="bottom" data-order="follow">Следовать</button>
                <button class="radial-btn" data-pos="left" data-order="hold">Держать</button>
            </div>
            <div id="bottom-panel">
                <div id="selected-unit">Командир отделения</div>
                <div id="orders">
                    <button id="btn-ai-mode" style="background: #4a3a6a;">ИИ: ВКЛ</button>
                    <button id="btn-move" class="active">Движ.</button>
                    <button id="btn-attack">Атака</button>
                    <button id="btn-hold">Держ.</button>
                    <button id="btn-follow">След.</button>
                    <button id="btn-reload" title="Перезарядка (R)" aria-label="Перезарядка">🔄</button>
                </div>
                <div id="grenade-panel">
                    <button id="btn-frag">💣 Граната</button>
                    <button id="btn-smoke">💨 Дым</button>
                </div>
                <div id="stances">
                    <button id="btn-stand" class="stance-btn active">🧍 Стоя</button>
                    <button id="btn-crouch" class="stance-btn">🧎 С колена</button>
                    <button id="btn-prone" class="stance-btn">🛌 Лёжа</button>
                </div>
                <div id="status-message"></div>
            </div>
            <canvas id="minimap"></canvas>
            <div id="game-over" class="hidden">
                <h1 id="result-text"></h1>
                <button id="btn-restart">Играть снова</button>
            </div>
        </div>
    </div>
    <div id="map-select">
        <h2>Отделение: РФ vs США</h2>
        <h3>Выбор карты</h3>
        <div class="map-buttons">
            <button id="map-open" class="map-btn map-open">🌾 Открытая</button>
            <button id="map-forest" class="map-btn map-forest">🌲 Лес</button>
            <button id="map-city" class="map-btn map-city">🏙 Город</button>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
