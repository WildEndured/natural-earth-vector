<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мировая карта — Natural Earth 10m</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div class="info-panel" id="infoPanel">
    <h3>Информация</h3>
    <div id="countryInfo"><p>Наведите на объект</p></div>
  </div>

  <div class="controls" id="controls">
    <h4>Слои</h4>

    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progressText">0 / 0 файлов</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-current" id="progressCurrent"></div>
    </div>

    <div class="status" id="status">Инициализация…</div>
  </div>

  <div class="legend">
    <h4>Легенда</h4>
    <div><span class="swatch country"></span> Страны</div>
    <div><span class="swatch dispute"></span> Спорные территории</div>
    <div><span class="swatch city"></span> Города</div>
    <div><span class="swatch lake"></span> Озёра</div>
    <div><span class="swatch river"></span> Реки</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
