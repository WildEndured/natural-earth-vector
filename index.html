<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MilSim // Tactical Map Interface</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Верхняя панель (HUD) -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">⨁ MILSIM // TACTICAL MAP</span>
    </div>
    <div class="topbar-center">
      <div class="coord-box">
        <span class="label">LAT:</span> <span id="hud-lat">0.0000</span>
        <span class="label">LON:</span> <span id="hud-lng">0.0000</span>
      </div>
      <div class="coord-box">
        <span class="label">ZOOM:</span> <span id="hud-zoom">2</span>
      </div>
    </div>
    <div class="topbar-right">
      <button id="btn-reset-view" title="Сбросить вид">Сброс вида</button>
    </div>
  </header>

  <!-- Карта -->
  <div id="map"></div>

  <!-- Левая панель: Диспетчер слоёв -->
  <aside class="panel left-panel" id="layerPanel">
    <div class="panel-header">
      <h3>УПРАВЛЕНИЕ СЛОЯМИ</h3>
      <button class="btn-collapse" id="btnCollapseLeft">◀</button>
    </div>
    <div class="panel-content">
      <!-- Прогресс загрузки -->
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progressText">Загрузка...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-current" id="progressCurrent"></div>
      </div>
      
      <!-- Аккордеон для категорий будет генерироваться в JS -->
      <div id="layerControls"></div>
    </div>
  </aside>

  <!-- Правая панель: Информация об объекте -->
  <aside class="panel right-panel" id="infoPanel">
    <div class="panel-header">
      <h3>ДАННЫЕ ОБЪЕКТА</h3>
    </div>
    <div class="panel-content" id="countryInfo">
      <p class="empty-msg">Наведите или кликните по объекту на карте для получения данных.</p>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
