<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Комната разработчика — Варгейм</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    padding: 30px 0;
    border-bottom: 2px solid #0f3460;
    margin-bottom: 30px;
  }
  h1 {
    color: #e94560;
    font-size: 2.2em;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
  }
  .subtitle {
    color: #a0a0a0;
    margin-top: 8px;
    font-size: 0.95em;
  }
  .panel {
    background: rgba(22, 33, 62, 0.8);
    border: 1px solid #0f3460;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .panel h2 {
    color: #e94560;
    margin-bottom: 18px;
    font-size: 1.3em;
    border-left: 4px solid #e94560;
    padding-left: 12px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    margin-bottom: 6px;
    color: #a0a0a0;
    font-size: 0.9em;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    background: #0f1a2e;
    border: 1px solid #0f3460;
    border-radius: 6px;
    color: #e0e0e0;
    font-size: 1em;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus {
    outline: none;
    border-color: #e94560;
    box-shadow: 0 0 8px rgba(233, 69, 96, 0.4);
  }
  .field input[readonly] {
    background: #0a1420;
    color: #6a7a8a;
    cursor: not-allowed;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  button {
    padding: 11px 22px;
    border: none;
    border-radius: 6px;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  .btn-primary {
    background: #e94560;
    color: #fff;
    box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
  }
  .btn-secondary {
    background: #0f3460;
    color: #e0e0e0;
  }
  .btn-danger {
    background: #a02030;
    color: #fff;
  }
  .btn-small {
    padding: 6px 12px;
    font-size: 0.85em;
  }
  .count-badge {
    display: inline-block;
    background: #e94560;
    color: #fff;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.8em;
    margin-left: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    padding: 12px 10px;
    text-align: left;
    border-bottom: 1px solid #0f3460;
  }
  th {
    color: #e94560;
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  td { font-size: 0.95em; }
  tr:hover td { background: rgba(15, 52, 96, 0.3); }
  .empty {
    text-align: center;
    color: #6a7a8a;
    padding: 30px;
    font-style: italic;
  }
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #0f3460;
    color: #e0e0e0;
    padding: 14px 22px;
    border-radius: 8px;
    border-left: 4px solid #e94560;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    transform: translateX(400px);
    transition: transform 0.3s ease;
    z-index: 100;
  }
  .toast.show { transform: translateX(0); }
  @media (max-width: 600px) {
    h1 { font-size: 1.5em; }
    th, td { padding: 8px 6px; font-size: 0.85em; }
    .hide-mobile { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚔️ Комната разработчика</h1>
    <div class="subtitle">Управление составом команды варгейма</div>
  </header>

  <div class="panel">
    <h2 id="formTitle">Добавить разработчика</h2>
    <div class="form-grid">
      <div class="field">
        <label for="devId">Уникальный ID</label>
        <input type="text" id="devId" placeholder="Например: DEV-001" readonly>
      </div>
      <div class="field">
        <label for="devFio">ФИО</label>
        <input type="text" id="devFio" placeholder="Иванов Иван Иванович" maxlength="100">
      </div>
      <div class="field">
        <label for="devAge">Возраст</label>
        <input type="number" id="devAge" placeholder="25" min="18" max="99">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="saveBtn" onclick="saveDev()">Добавить</button>
      <button class="btn-secondary" onclick="resetForm()">Сбросить</button>
    </div>
  </div>

  <div class="panel">
    <h2>Список разработчиков <span class="count-badge" id="count">0</span></h2>
    <div id="tableWrap">
      <table id="devTable">
        <thead>
          <tr>
            <th>Уникальный ID</th>
            <th>ФИО</th>
            <th>Возраст</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="devBody"></tbody>
      </table>
      <div class="empty" id="emptyMsg">Пока нет ни одного разработчика. Добавьте первого!</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== Хранилище в localStorage =====
const STORAGE_KEY = 'wargame_devs_v1';
let developers = [];
let editingId = null;

// ===== Генерация уникального ID =====
function generateId() {
  const used = new Set(developers.map(d => d.id));
  let n = developers.length + 1;
  let id;
  do {
    id = 'DEV-' + String(n).padStart(3, '0');
    n++;
  } while (used.has(id));
  return id;
}

// ===== Загрузка / сохранение =====
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    developers = raw ? JSON.parse(raw) : [];
  } catch (e) {
    developers = [];
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(developers));
}

// ===== Уведомления =====
let toastTimer = null;
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderLeftColor = isError ? '#ff4757' : '#e94560';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== Валидация =====
function validate(fio, age) {
  if (!fio.trim()) return 'Укажите ФИО';
  if (fio.trim().length < 3) return 'ФИО слишком короткое';
  if (!/^[А-Яа-яЁёA-Za-z\s\-\.]+$/.test(fio.trim())) return 'ФИО содержит недопустимые символы';
  if (age === '' || isNaN(age)) return 'Укажите возраст';
  const a = Number(age);
  if (!Number.isInteger(a)) return 'Возраст должен быть целым числом';
  if (a < 18 || a > 99) return 'Возраст должен быть от 18 до 99';
  return null;
}

// ===== Рендер таблицы =====
function render() {
  const body = document.getElementById('devBody');
  const empty = document.getElementById('emptyMsg');
  const count = document.getElementById('count');
  body.innerHTML = '';
  count.textContent = developers.length;

  if (developers.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    developers.forEach(dev => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><code>${escapeHtml(dev.id)}</code></td>
        <td>${escapeHtml(dev.fio)}</td>
        <td>${dev.age}</td>
        <td>
          <button class="btn-secondary btn-small" onclick="editDev('${dev.id}')">✎</button>
          <button class="btn-danger btn-small" onclick="deleteDev('${dev.id}')">✕</button>
        </td>
      `;
      body.appendChild(tr);
    });
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ===== CRUD =====
function saveDev() {
  const fio = document.getElementById('devFio').value;
  const age = document.getElementById('devAge').value;
  const err = validate(fio, age);
  if (err) { showToast('⚠ ' + err, true); return; }

  if (editingId) {
    const dev = developers.find(d => d.id === editingId);
    if (dev) {
      dev.fio = fio.trim();
      dev.age = Number(age);
    }
    showToast('✔ Изменения сохранены');
  } else {
    const newId = generateId();
    developers.push({ id: newId, fio: fio.trim(), age: Number(age) });
    showToast('✔ Добавлен ' + newId);
  }
  saveData();
  render();
  resetForm();
}

function editDev(id) {
  const dev = developers.find(d => d.id === id);
  if (!dev) return;
  editingId = id;
  document.getElementById('devId').value = dev.id;
  document.getElementById('devFio').value = dev.fio;
  document.getElementById('devAge').value = dev.age;
  document.getElementById('formTitle').textContent = 'Редактировать: ' + dev.id;
  document.getElementById('saveBtn').textContent = 'Сохранить изменения';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteDev(id) {
  const dev = developers.find(d => d.id === id);
  if (!dev) return;
  if (!confirm(`Удалить разработчика ${dev.fio} (${dev.id})?`)) return;
  developers = developers.filter(d => d.id !== id);
  if (editingId === id) resetForm();
  saveData();
  render();
  showToast('Удалено: ' + id);
}

function resetForm() {
  editingId = null;
  document.getElementById('devId').value = generateId();
  document.getElementById('devFio').value = '';
  document.getElementById('devAge').value = '';
  document.getElementById('formTitle').textContent = 'Добавить разработчика';
  document.getElementById('saveBtn').textContent = 'Добавить';
}

// ===== Инициализация =====
document.addEventListener('DOMContentLoaded', () => {
  loadData();
  render();
  resetForm();

  // Enter для добавления
  document.getElementById('devAge').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveDev();
  });
});
</script>
</body>
</html>
