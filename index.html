<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <title>Отделение: РФ vs США — Тактический бой</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
        <div id="ui">
            <!-- Верхняя панель -->
            <div id="top-panel">
                <div class="team-info" id="ru-info">
                    <h3>🇷🇺 МСО РФ</h3>
                    <div id="ru-count">Живых: 6/6</div>
                </div>
                <div id="mission-info">
                    <div>Точка <span id="objective-status">(нейтральна)</span></div>
                    <div id="mission-timer">00:00</div>
                </div>
                <div class="team-info" id="us-info">
                    <h3>🇺🇸 США</h3>
                    <div id="us-count">Живых: 9/9</div>
                    <div id="us-groups" style="font-size: 10px; color: #ffd700; margin-top: 2px;">А: огонь · Б: маневр</div>
                </div>
            </div>

            <!-- Панель ТТХ оружия -->
            <div id="weapon-info">
                <div id="wi-name">АК-74М</div>
                <div id="wi-stats">
                    <div><span>Калибр:</span> <b id="wi-caliber">5.45×39</b></div>
                    <div><span>Масса:</span> <b id="wi-weight">3.3 кг</b></div>
                    <div><span>БК:</span> <b id="wi-ammo">180 / 30</b></div>
                    <div><span>Дальность:</span> <b id="wi-range">250 / 600 м</b></div>
                    <div><span>Темп:</span> <b id="wi-rpm">650 в/м</b></div>
                </div>
            </div>

            <!-- Кнопки камеры -->
            <div id="camera-controls">
                <button id="cam-up" title="Вверх">▲</button>
                <button id="cam-zoom-in" title="Приблизить">+</button>
                <button id="cam-zoom-out" title="Отдалить">−</button>
                <button id="cam-down" title="Вниз">▼</button>
            </div>

            <!-- Радиальное меню -->
            <div id="radial-menu">
                <button class="radial-btn" data-pos="top" data-order="attack">Атака</button>
                <button class="radial-btn" data-pos="right" data-order="move">Движение</button>
                <button class="radial-btn" data-pos="bottom" data-order="follow">Следовать</button>
                <button class="radial-btn" data-pos="left" data-order="hold">Держать</button>
            </div>

            <!-- Нижняя панель -->
            <div id="bottom-panel">
                <div id="selected-unit">Командир отделения</div>
                <div id="orders">
                    <button id="btn-ai-mode" style="background: #4a3a6a;">ИИ: ВКЛ</button>
                    <button id="btn-formation">Колонна</button>
                    <button id="btn-move" class="active">Движ.</button>
                    <button id="btn-attack">Атака</button>
                    <button id="btn-hold">Держ.</button>
                    <button id="btn-follow">След.</button>
                    <button id="btn-reload" title="Перезарядка (R)">🔄</button>
                </div>
                <div id="stances">
                    <button id="btn-stand" class="stance-btn active">🧍 Стоя</button>
                    <button id="btn-crouch" class="stance-btn">🧎 С колена</button>
                    <button id="btn-prone" class="stance-btn">🛌 Лёжа</button>
                </div>
                <div id="status-message"></div>
            </div>

            <canvas id="minimap"></canvas>

            <div id="game-over" class="hidden">
                <h1 id="result-text"></h1>
                <button onclick="location.reload()">Играть снова</button>
            </div>
        </div>
    </div>

    <!-- Экран выбора карты -->
    <div id="map-select" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:300; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
        <h2 style="color:#ffd700; margin-bottom:20px; font-size:28px;">Выбор карты</h2>
        <p style="color:#aaa; margin-bottom:20px;">Выберите ландшафт для боя</p>
        <div style="display:flex; gap:15px; flex-wrap:wrap; justify-content:center;">
            <button id="map-open" style="padding:20px 40px; font-size:18px; background:#3a3a3a; border:2px solid #666; border-radius:8px; color:#fff; cursor:pointer;">Открытая</button>
            <button id="map-forest" style="padding:20px 40px; font-size:18px; background:#2a3a24; border:2px solid #4a6a4a; border-radius:8px; color:#fff; cursor:pointer;">Лес</button>
            <button id="map-city" style="padding:20px 40px; font-size:18px; background:#4a4a4a; border:2px solid #888; border-radius:8px; color:#fff; cursor:pointer;">Город</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
