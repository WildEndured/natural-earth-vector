<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Глобальная карта — Война</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #3b7a3b;
            --bg-dark: rgba(30, 40, 50, 0.95);
            --text-light: #eee;
            --accent: #ffcc00;
            --danger: #e74c3c;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; z-index: 1; background: #aad3df; }

        /* ... (Все стили, которые были в прошлом index.html, остаются здесь) ... */
        /* Чтобы не занимать 200 строк, я предполагаю, что вы их скопируете из прошлого ответа. 
           Главное, чтобы они были внутри <style> */
        
        /* Временный блок стилей для тестового полигона */
        #test-arena-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #2c3e50; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
        }
        #test-arena-modal h1 { margin-top: 0; color: #f1c40f; }
        
        /* Стили для остальной части интерфейса (сокращенно, предполагаем, что они есть) */
        #top-bar { display: none; } /* Скрываем панель, пока играем на полигоне */
        .panel { display: none; }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div id="top-bar">
        <!-- ... код панели ... -->
    </div>

    <div id="map"></div>

    <!-- ... (Модалки Боя, Панели и т.д. остаются здесь) ... -->
    <div id="combat-modal">...</div>
    <div id="map-options" class="panel">...</div>
    <div id="diplo-panel" class="panel">...</div>
    <div id="hq-panel" class="panel">...</div>
    <div id="gru-panel" class="panel">...</div>
    <div id="sof-panel" class="panel">...</div>
    <div id="unit-panel" class="panel">...</div>
    <div id="order-modal" class="modal">...</div>
    <div id="leader-modal" class="modal">...</div>

    <!-- СКРИПТЫ -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="js/politics/leaders.js"></script>
    <script src="js/utils/infrastructure.js"></script>
    <script src="js/core/map_manager.js"></script>
    <script src="js/core/time.js"></script>
    <script src="js/core/orders.js"></script>
    <script src="js/military/military.js"></script>
    <script src="js/military/combat.js"></script>
    <script src="js/military/soldier.js"></script>
    <script src="js/ai/world_ai.js"></script>
    
    <!-- НОВЫЙ ФАЙЛ -->
    <script src="js/core/test_arena.js"></script>

    <script>
        // Весь код инициализации (Diplomacy, window.map, setTimeout...) остается здесь.
        // ...

        // ЗАПУСК ТЕСТОВОГО ПОЛИГОНА ПЕРЕД ОСНОВНОЙ ИГРОЙ
        window.addEventListener('load', () => {
            // Полигон запускается сразу
            TestArena.init();
            
            // Скрываем верхнюю панель, пока не выйдем с полигона
            document.getElementById('top-bar').style.display = 'none';
            
            // Перехватываем кнопку "Перейти к карте мира", чтобы вернуть панель
            const originalSkip = document.getElementById('arena-skip-btn').onclick;
            document.getElementById('arena-skip-btn').onclick = () => {
                document.getElementById('test-arena-modal').remove(); // Уничтожаем полигон
                document.getElementById('top-bar').style.display = 'flex'; // Возвращаем панель
                // Теперь можно инициализировать карту, если она не была инициализирована
                // (в нашем случае window.map уже создан, так что просто обновляем его размер)
                if (window.map) window.map.invalidateSize();
            };
        });
    </script>
</body>
</html>
