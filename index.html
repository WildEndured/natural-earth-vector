<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MilSim // Weather & Nature Engine</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">⨁ MILSIM // NATURE ENGINE</span>
    </div>
    <div class="topbar-center">
      <div class="coord-box">
        <span class="label">LAT:</span> <span id="hud-lat">0.0000</span>
        <span class="label">LON:</span> <span id="hud-lng">0.0000</span>
      </div>
      <div class="coord-box">
        <span class="label">TIME:</span> <span id="hud-time">--:-- UTC</span>
      </div>
      <div class="coord-box">
        <span class="label">SEASON:</span> <span id="hud-season" style="color:#e67e22;">----</span>
      </div>
      <button id="btn-pause-time">⏸ Пауза</button>
      <button id="btn-spawn-disaster" title="Вызвать случайную катастрофу">💥 Катастрофа</button>
      <button id="btn-reset-view" title="Сбросить вид">Сброс вида</button>
    </div>
  </header>

  <div id="map"></div>

  <aside class="panel left-panel" id="layerPanel">
    <div class="panel-header">
      <h3>УПРАВЛЕНИЕ СЛОЯМИ</h3>
    </div>
    <div class="panel-content">
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progressText">Загрузка...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-current" id="progressCurrent"></div>
      </div>
      <div id="layerControls"></div>
    </div>
  </aside>

  <aside class="panel right-panel">
    <div class="panel-header">
      <h3>ДАННЫЕ ОБЪЕКТА</h3>
    </div>
    <div class="panel-content" id="countryInfo">
      <p class="empty-msg">Наведите или кликните по объекту на карте.</p>
    </div>
  </aside>

  <!-- SunCalc — расчёт положения солнца -->
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Карта и слои -->
  <script src="script.js"></script>
  <!-- Движок погоды -->
  <script src="weather.js"></script>
</body>
</html>
